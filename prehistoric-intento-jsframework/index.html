<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prehistoric Tribes - Godot/Phaser Web Edition</title>
    <style>
        /* Reseteo básico para que el juego ocupe toda la pantalla sin barras de desplazamiento */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        /* Asegurar que el canvas de Phaser no tenga bordes raros */
        canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
    
    <!-- Cargar el motor de Phaser 3 desde un CDN (versión estable) -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <!-- Contenedor donde Phaser inyectará el elemento <canvas> -->
    <div id="game-container"></div>
    
    <!-- PUNTO DE ENTRADA CRÍTICO: type="module" habilita import/export -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
